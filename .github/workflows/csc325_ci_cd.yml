name: CI/CD Pipeline for CSC 325 Django Project
on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python manage.py test

      - name: Deploy
        run: echo "Deploying the application..."